---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ansible ansible-lint yamllint

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ansible

      - name: Syntax check site.yml
        run: ansible-playbook site.yml --syntax-check

      - name: Syntax check verify.yml
        run: ansible-playbook tests/verify.yml --syntax-check

  template-tests:
    name: Template Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run template tests
        run: pytest tests/unit/ -v

  molecule:
    name: "Molecule (${{ matrix.role }})"
    runs-on: ubuntu-latest
    needs: [lint, syntax-check]
    strategy:
      fail-fast: false
      matrix:
        role:
          - common
          - cis_hardening
          - nginx
          - cloudflare_warp
          - kiosk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ansible molecule molecule-plugins[docker] docker

      - name: Install Ansible collections
        run: ansible-galaxy collection install ansible.posix community.general

      - name: Run Molecule
        run: molecule test
        working-directory: "roles/${{ matrix.role }}"
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
