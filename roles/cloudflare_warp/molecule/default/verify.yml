---
- name: Verify
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Check GPG keyring exists
      ansible.builtin.stat:
        path: /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
      register: cloudflare_warp_gpg_keyring

    - name: Assert GPG keyring exists
      ansible.builtin.assert:
        that:
          - cloudflare_warp_gpg_keyring.stat.exists
        fail_msg: "Cloudflare WARP GPG keyring does not exist"

    - name: Check apt repo source file exists
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/cloudflare-client.list
      register: cloudflare_warp_apt_repo

    - name: Assert apt repo source file exists
      ansible.builtin.assert:
        that:
          - cloudflare_warp_apt_repo.stat.exists
        fail_msg: "Cloudflare WARP apt repo source file does not exist"

    - name: Check MDM directory exists
      ansible.builtin.stat:
        path: /var/lib/cloudflare-warp
      register: cloudflare_warp_mdm_dir

    - name: Assert MDM directory exists
      ansible.builtin.assert:
        that:
          - cloudflare_warp_mdm_dir.stat.exists
          - cloudflare_warp_mdm_dir.stat.isdir
        fail_msg: "MDM directory does not exist"

    - name: Check mdm.xml exists
      ansible.builtin.stat:
        path: /var/lib/cloudflare-warp/mdm.xml
      register: cloudflare_warp_mdm_xml

    - name: Assert mdm.xml exists with correct permissions
      ansible.builtin.assert:
        that:
          - cloudflare_warp_mdm_xml.stat.exists
          - cloudflare_warp_mdm_xml.stat.mode == '0400'
        fail_msg: "mdm.xml does not exist or has wrong permissions"

    - name: Read mdm.xml contents
      ansible.builtin.slurp:
        src: /var/lib/cloudflare-warp/mdm.xml
      register: cloudflare_warp_mdm_xml_content

    - name: Assert mdm.xml contains organization
      ansible.builtin.assert:
        that:
          - "'test-org' in cloudflare_warp_mdm_xml_content.content | b64decode"
        fail_msg: "mdm.xml does not contain expected organization"
