---
- name: Converge
  hosts: all
  become: true

  vars:
    molecule_test: true

  pre_tasks:
    - name: Create video group
      ansible.builtin.group:
        name: video
        state: present

    - name: Create render group
      ansible.builtin.group:
        name: render
        state: present

    - name: Create input group
      ansible.builtin.group:
        name: input
        state: present

    - name: Create X11 directory (normally from xorg package)
      ansible.builtin.file:
        path: /etc/X11
        state: directory
        owner: root
        group: root
        mode: "0755"

  roles:
    - role: kiosk
