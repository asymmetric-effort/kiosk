---
- name: CIS 3.x - Deploy sysctl hardening configuration
  ansible.builtin.template:
    src: sysctl-hardening.conf.j2
    dest: /etc/sysctl.d/99-cis-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl

- name: CIS 3.x - Apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: false
