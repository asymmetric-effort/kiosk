---
- name: CIS 5.3.1 - Install password quality library
  ansible.builtin.apt:
    name: libpam-pwquality
    state: present

- name: CIS 5.3.1 - Configure password quality
  ansible.builtin.template:
    src: pwquality.conf.j2
    dest: /etc/security/pwquality.conf
    owner: root
    group: root
    mode: "0644"

- name: CIS 5.4.1 - Set password expiration in login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^{{ item.key }}"
    line: "{{ item.key }} {{ item.value }}"
  loop:
    - {key: "PASS_MAX_DAYS", value: "{{ cis_hardening_password_max_days }}"}
    - {key: "PASS_MIN_DAYS", value: "{{ cis_hardening_password_min_days }}"}
    - {key: "PASS_WARN_AGE", value: "{{ cis_hardening_password_warn_days }}"}
    - {key: "UMASK", value: "027"}
    - {key: "ENCRYPT_METHOD", value: "SHA512"}

- name: CIS 5.4.4 - Set default umask
  ansible.builtin.copy:
    dest: /etc/profile.d/cis-umask.sh
    content: |
      umask 027
    owner: root
    group: root
    mode: "0644"

- name: CIS 5.5 - Lock root account for direct login
  ansible.builtin.user:
    name: root
    password_lock: true

- name: CIS 5.3.2 - Configure PAM faillock
  ansible.builtin.copy:
    dest: /etc/security/faillock.conf
    content: |
      deny = {{ cis_hardening_faillock_deny }}
      unlock_time = {{ cis_hardening_faillock_unlock_time }}
      audit
      even_deny_root
    owner: root
    group: root
    mode: "0644"

- name: CIS 5.6 - Restrict su to sudo group
  ansible.builtin.lineinfile:
    path: /etc/pam.d/su
    regexp: '^#?\s*auth\s+required\s+pam_wheel.so'
    line: "auth required pam_wheel.so use_uid group=sudo"

- name: CIS 1.5.1 - Restrict core dumps
  ansible.builtin.copy:
    dest: /etc/security/limits.d/cis-limits.conf
    content: |
      * hard core 0
      * soft nproc 1024
      * hard nproc 65535
    owner: root
    group: root
    mode: "0644"
