---
- name: CIS 2.x - Disable and mask unnecessary services
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop: "{{ cis_hardening_disabled_services }}"
  failed_when: false

- name: CIS 2.2.1 - Ensure time synchronization is configured
  ansible.builtin.apt:
    name: chrony
    state: present

- name: CIS 2.2.1 - Enable chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
