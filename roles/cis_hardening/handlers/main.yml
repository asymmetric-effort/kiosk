---
- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted

- name: Restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted
  failed_when: false

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload ufw
  ansible.builtin.service:
    name: ufw
    state: restarted
  failed_when: false
